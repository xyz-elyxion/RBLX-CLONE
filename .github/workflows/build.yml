name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: C++ (windows-latest)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure Windows (VS 2026 preset matches the runner image)
        run: cmake --preset windows-insiders

      - name: Build
        run: cmake --build build/windows-insiders --parallel

      - name: Test
        run: ctest --test-dir build/windows-insiders --output-on-failure -C Debug

      - name: Collect game executables and assets
        run: |
          New-Item -ItemType Directory -Force -Path dist/shaders | Out-Null
          Copy-Item build/windows-insiders/Debug/Studio.exe dist/
          Copy-Item build/windows-insiders/Debug/Client.exe dist/
          Copy-Item build/windows-insiders/Debug/Server.exe dist/
          Copy-Item build/windows-insiders/Debug/WebServer.exe dist/
          Copy-Item shaders/*.glsl dist/shaders/
          Copy-Item face*.png dist/
          Copy-Item ServerWorld.world dist/
          Get-ChildItem dist -Recurse | Select-Object FullName, Length

      - name: Upload game executables
        uses: actions/upload-artifact@v4
        with:
          name: RBLXClone-windows-x64
          path: dist/
          if-no-files-found: error

  docker:
    name: Docker (web server)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image (compiles WebServer and runs its tests inside)
        run: docker build -t limey-webserver:ci .

      - name: Smoke test the container
        run: |
          docker run -d --name limey-smoke -p 39999:3000 \
            -e JWT_SECRET=ci-smoke-secret-value-32-chars-min!! \
            limey-webserver:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:39999/api/games > /dev/null 2>&1; then
              echo "Server is up."
              break
            fi
            if [ "$i" = "30" ]; then
              echo "Server did not become ready in time."
              docker logs limey-smoke
              exit 1
            fi
            sleep 1
          done
          echo "--- GET / (site) ---"
          curl -fsS http://127.0.0.1:39999/ | head -5
          echo "--- GET /api/games (API) ---"
          curl -fsS http://127.0.0.1:39999/api/games | head -3
          echo "--- auth check: verify rejects unsigned token ---"
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X POST http://127.0.0.1:39999/api/verify \
            -H "Authorization: Bearer bogus-token")
          echo "status: $code"
          [ "$code" = "401" ] || { echo "expected 401 for bogus token"; docker logs limey-smoke; exit 1; }
          docker rm -f limey-smoke > /dev/null
