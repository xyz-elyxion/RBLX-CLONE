name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies (GL, X11, Wayland for GLFW)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libgl1-mesa-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            wayland-protocols \
            libwayland-dev \
            libxkbcommon-dev

      - name: Configure Windows (VS 2026 preset matches the runner image)
        if: runner.os == 'Windows'
        run: cmake --preset windows-insiders

      - name: Configure Linux (Studio + tests; Client/Server are Windows-only)
        if: runner.os == 'Linux'
        run: >
          cmake -S . -B build/linux -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DRBLX_BUILD_CLIENT=OFF
          -DRBLX_BUILD_SERVER=OFF
          -DRBLX_BUILD_STUDIO=ON
          -DRBLX_BUILD_TESTS=ON

      - name: Build
        run: cmake --build ${{ runner.os == 'Windows' && 'build/windows-insiders' || 'build/linux' }} --parallel

      - name: Test
        run: ctest --test-dir ${{ runner.os == 'Windows' && 'build/windows-insiders' || 'build/linux' }} --output-on-failure -C Debug

      - name: Collect game executables and assets
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path dist/shaders | Out-Null
          Copy-Item build/windows-insiders/Debug/Studio.exe dist/
          Copy-Item build/windows-insiders/Debug/Client.exe dist/
          Copy-Item build/windows-insiders/Debug/Server.exe dist/
          Copy-Item build/windows-insiders/Debug/WebServer.exe dist/
          Copy-Item shaders/*.glsl dist/shaders/
          Copy-Item face*.png dist/
          Copy-Item ServerWorld.world dist/
          Get-ChildItem dist -Recurse | Select-Object FullName, Length

      - name: Upload game executables
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: RBLXClone-windows-x64
          path: dist/
          if-no-files-found: error

  web-server-tests:
    name: C++ web server tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Build web server and tests
        run: |
          mkdir -p build/web-ci
          gcc -std=c11 -O2 -c vendor/sqlite/sqlite3.c -Ivendor/sqlite -DSQLITE_THREADSAFE=1 -o build/web-ci/sqlite3.o
          gcc -std=c99 -c vendor/bcrypt/crypt_blowfish.c -Ivendor/bcrypt -o build/web-ci/crypt_blowfish.o
          gcc -std=c99 -c vendor/bcrypt/crypt_gensalt.c -Ivendor/bcrypt -o build/web-ci/crypt_gensalt.o
          for f in WebCrypto HttpServer WebApp WebAppApi WebAppSocial WebAppGames WebAppWorld WebAppInstances; do
            g++ -std=c++17 -O2 -c src/web/$f.cpp -Isrc/web -Ivendor/json -Ivendor/sqlite -Ivendor/bcrypt -o build/web-ci/$f.o
          done
          g++ -std=c++17 -O2 -c tests/web_server_tests.cpp -Isrc/web -Ivendor/json -Ivendor/sqlite -Ivendor/bcrypt -o build/web-ci/tests.o
          g++ -o build/web-ci/web_server_tests build/web-ci/*.o -lpthread

      - name: Test
        run: ./build/web-ci/web_server_tests
